# Safe settings for a real family-laptop installation. Activate this profile
# explicitly with --spring.profiles.active=deployment or SPRING_PROFILES_ACTIVE.

# === Database (required; deliberately no credential defaults) ===
spring.datasource.url=${BLOOM_DB_URL}
spring.datasource.username=${BLOOM_DB_USERNAME}
spring.datasource.password=${BLOOM_DB_PASSWORD}

# === Schema ownership and validation ===
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:migration
spring.flyway.validate-on-migrate=true
spring.flyway.validate-migration-naming=true
spring.flyway.fail-on-missing-locations=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.out-of-order=false

# === Production logging ===
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.root=INFO
logging.level.com.bloom=INFO
logging.level.org.springframework.web=INFO
logging.level.org.flywaydb=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF
logging.file.name=${BLOOM_LOG_FILE:logs/bloom-app.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=200MB

# === Local-only server and graceful shutdown ===
server.address=${BLOOM_SERVER_ADDRESS:127.0.0.1}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# === Health check ===
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# === Browser access ===
cors.allowed-origins=${BLOOM_CORS_ALLOWED_ORIGINS:http://localhost:5173}
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# === Operational dashboard ===
bloom.dashboard.store-zone-id=${BLOOM_STORE_ZONE_ID:Asia/Jakarta}
bloom.dashboard.freshness=${BLOOM_DASHBOARD_FRESHNESS:PT5M}

# Safe settings for a real family-laptop installation. Activate this profile
# explicitly with --spring.profiles.active=deployment or SPRING_PROFILES_ACTIVE.

# === Database (required; deliberately no credential defaults) ===
spring.datasource.url=${BLOOM_DB_URL}
spring.datasource.username=${BLOOM_DB_USERNAME}
spring.datasource.password=${BLOOM_DB_PASSWORD}

# === Schema ownership and validation ===
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:migration
spring.flyway.validate-on-migrate=true
spring.flyway.validate-migration-naming=true
spring.flyway.fail-on-missing-locations=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.out-of-order=false

# === Production logging ===
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.root=INFO
logging.level.com.bloom=INFO
logging.level.org.springframework.web=INFO
logging.level.org.flywaydb=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF
logging.file.name=${BLOOM_LOG_FILE:logs/bloom-app.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=200MB

# === Local-only server and graceful shutdown ===
server.address=${BLOOM_SERVER_ADDRESS:127.0.0.1}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# === Health check ===
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# === Browser access ===
cors.allowed-origins=${BLOOM_CORS_ALLOWED_ORIGINS:http://localhost:5173}
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# === Operational dashboard ===
bloom.store-zone-id=${BLOOM_STORE_ZONE_ID:Asia/Jakarta}
bloom.dashboard.freshness=${BLOOM_DASHBOARD_FRESHNESS:PT5M}

# === Database Backup ===
# Daily at 16:30 in the configured store zone. Set the executable variables to
# full paths when PostgreSQL's bin directory is not on PATH.
bloom.backup.enabled=${BLOOM_BACKUP_ENABLED:true}
bloom.backup.directory=${BLOOM_BACKUP_DIRECTORY:C:/Bloom/backups}
bloom.backup.pg-dump-path=${BLOOM_PG_DUMP_PATH:C:/Program Files/PostgreSQL/15/bin/pg_dump.exe}
bloom.backup.pg-restore-path=${BLOOM_PG_RESTORE_PATH:C:/Program Files/PostgreSQL/15/bin/pg_restore.exe}
bloom.backup.retention-days=${BLOOM_BACKUP_RETENTION_DAYS:30}
bloom.backup.cron=${BLOOM_BACKUP_CRON:0 30 16 * * *}
bloom.backup.command-timeout=${BLOOM_BACKUP_COMMAND_TIMEOUT:PT30M}
